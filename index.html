<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Innebandyturnering</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!--HEADER-->

    <header class="site-header">
        <div class="header-inner">

            <div>
                <div class="eyebrow">INNEBANDYTURNERING</div>
                <h1>Turneringen</h1>
                <p>Gruppspel → Slutspel → Final</p>
            </div>

            <div class="header-badge">
                🏑
            </div>

        </div>
    </header>


    <main class="container">

        <!--CURRENT MATCH-->

        <section
            id="current-match-section"
            class="current-match-section"
        >

            <div class="section-kicker">
                JUST NU
            </div>

            <div
                id="current-match-card"
                class="current-match-card"
            >
                <!-- Renderas av JavaScript -->
            </div>

        </section>


        <!--STANDINGS-->

        <section class="panel standings-panel">

            <div class="panel-heading">

                <div>
                    <div class="panel-kicker">
                        GRUPPSPEL
                    </div>

                    <h2>Tabell</h2>
                </div>

                <div class="panel-icon">
                    📊
                </div>

            </div>

            <div class="table-wrap">

                <table class="standings-table">

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Lag</th>
                            <th>MS</th>
                            <th>V</th>
                            <th>O</th>
                            <th>F</th>
                            <th>GM</th>
                            <th>IM</th>
                            <th>+/−</th>
                            <th>P</th>
                        </tr>
                    </thead>

                    <tbody id="standings-body">
                        <!-- Renderas av JavaScript -->
                    </tbody>

                </table>

            </div>

        </section>


        <!--GROUP MATCHES – COLLAPSIBLE-->

        <section class="collapse-panel">

            <button
                class="collapse-header"
                type="button"
                aria-expanded="false"
                onclick="togglePanel('group-matches-panel', this)"
            >

                <span class="collapse-title-wrap">

                    <span class="collapse-icon">
                        📅
                    </span>

                    <span>
                        Gruppmatcher
                    </span>

                </span>

                <span class="collapse-arrow">
                    ⌄
                </span>

            </button>


            <div
                id="group-matches-panel"
                class="collapse-content"
            >

                <div class="collapse-inner">

                    <div class="table-wrap">

                        <table class="matches-table">

                            <thead>
                                <tr>
                                    <th>Match</th>
                                    <th>Lag</th>
                                    <th>Resultat</th>
                                    <th>Status</th>
                                </tr>
                            </thead>

                            <tbody id="matches-body">
                                <!-- Renderas av JavaScript -->
                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </section>


        <!--PLAYOFFS – COLLAPSIBLE-->

        <section class="collapse-panel">

            <button
                class="collapse-header"
                type="button"
                aria-expanded="false"
                onclick="togglePanel('playoff-panel', this)"
            >

                <span class="collapse-title-wrap">

                    <span class="collapse-icon">
                        🏆
                    </span>

                    <span>
                        Slutspel
                    </span>

                </span>

                <span class="collapse-arrow">
                    ⌄
                </span>

            </button>


            <div
                id="playoff-panel"
                class="collapse-content"
            >

                <div class="collapse-inner">

                    <div class="playoff-grid">

                        <!-- SEMIFINAL 1 -->

                        <div
                            id="semi1-card"
                            class="playoff-card"
                        >

                            <div class="playoff-label">
                                SEMIFINAL 1
                            </div>

                            <div
                                id="semi1-team1"
                                class="playoff-team"
                            >
                                —
                            </div>

                            <div class="playoff-vs">
                                VS
                            </div>

                            <div
                                id="semi1-team2"
                                class="playoff-team"
                            >
                                —
                            </div>

                            <div
                                id="semi1-result"
                                class="playoff-result"
                            >
                                —
                            </div>

                        </div>


                        <!-- SEMIFINAL 2 -->

                        <div
                            id="semi2-card"
                            class="playoff-card"
                        >

                            <div class="playoff-label">
                                SEMIFINAL 2
                            </div>

                            <div
                                id="semi2-team1"
                                class="playoff-team"
                            >
                                —
                            </div>

                            <div class="playoff-vs">
                                VS
                            </div>

                            <div
                                id="semi2-team2"
                                class="playoff-team"
                            >
                                —
                            </div>

                            <div
                                id="semi2-result"
                                class="playoff-result"
                            >
                                —
                            </div>

                        </div>


                        <!-- FINAL -->

                        <div
                            id="final-card"
                            class="playoff-card final-card"
                        >

                            <div class="playoff-label">
                                FINAL
                            </div>

                            <div
                                id="final-team1"
                                class="playoff-team"
                            >
                                —
                            </div>

                            <div class="playoff-vs">
                                VS
                            </div>

                            <div
                                id="final-team2"
                                class="playoff-team"
                            >
                                —
                            </div>

                            <div
                                id="final-result"
                                class="playoff-result"
                            >
                                —
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!--FOOTER-->

        <footer class="site-footer">
            <span>🏑</span>
            Innebandyturnering
            <span>•</span>
            Lycka till!
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
